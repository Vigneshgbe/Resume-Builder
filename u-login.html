   <title>Login</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           margin: 0;
           padding: 0;
           box-sizing: border-box;
           background: #f5f5f5;
       }

       .login-container {
           width: 90%;
           max-width: 400px;
           background: #fff;
           padding: 30px;
           border-radius: 8px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
           margin: 50px auto;
           text-align: center;
       }

       .login-container h2 {
           margin-bottom: 20px;
           color: #aa076b;
       }

       .login-container input[type="text"],
       .login-container input[type="password"] {
           width: 100%;
           padding: 12px;
           margin: 8px 0;
           border-radius: 4px;
           border: 1px solid #ddd;
           box-sizing: border-box;
       }

       .login-container button {
           width: 100%;
           background-color: #007bff;
           color: white;
           padding: 12px;
           border: none;
           border-radius: 4px;
           cursor: pointer;
           margin-top: 10px;
           font-size: 16px;
       }

       .login-container button:hover {
           background-color: #0056b3;
       }

       .login-container .register-link,
       .login-container .forgot-password-link {
           display: block;
           margin-top: 15px;
           color: #007bff;
           text-decoration: none;
       }

       .toast {
           visibility: hidden;
           min-width: 250px;
           margin-left: -125px;
           background: linear-gradient(135deg, #aa076b, #61045f);
           color: #fff;
           text-align: center;
           border-radius: 5px;
           padding: 16px;
           position: fixed;
           z-index: 1;
           left: 50%;
           bottom: 30px;
           font-size: 17px;
       }

       .toast.show {
           visibility: visible;
           animation: fadein 0.5s, fadeout 0.5s 1.5s; /* Adjusted to 1.5 seconds delay for fadeout */
       }

       @keyframes fadein {
           from {
               bottom: 0;
               opacity: 0;
           }
           to {
               bottom: 30px;
               opacity: 1;
           }
       }

       @keyframes fadeout {
           from {
               bottom: 30px;
               opacity: 1;
           }
           to {
               bottom: 0;
               opacity: 0;
           }
       }

       .footer {
           background-color: #343a40; /* Match navbar color */
           color: #fff;
           text-align: center;
           padding: 20px;
           margin: 0;
           position: static;
           width: 100%;
           margin-top: auto; /* Pushes footer to bottom if content is short */
       }
    
       .footer p {
           margin: 0;
           font-size: 0.9rem;
       }
   </style>
</head>
<body>
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Resume Builder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><strong>HOME</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="free.html"><strong>FREE</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="coupon-code.html"><strong>PAID</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><strong>ABOUT US</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html"><strong>CONTACT US</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html"><strong>PRICING</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="terms-and-conditions.html"><strong>TERMS</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="privacy-policy.html"><strong>PRIVACY</strong></a></li>
                </ul>
            </div>
        </div>
    </nav>

   <div class="login-container">
       <h2>Login</h2>
       <form id="loginForm">
           <input type="text" name="username" placeholder="User Mail Id" required>
           <input type="password" name="password" placeholder="Password" required>
           <button type="submit">Login</button>
           <p><a href="/u-register.html" class="register-link">Don't have an account? Register</a></p>
           <p><a href="#" class="forgot-password-link" id="forgotPassword">Forgot Password?</a></p>
       </form>
       <!-- Toast Message Display -->
        <div id="toast" class="toast"></div>
   </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Developed by iGreatApps <span id="currentYear"></span>. All rights reserved.</p>
    </footer>
  

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByIQWS4VhN_GMhGPy-o8Mp3HHZLXKAU_k",
      authDomain: "web-development-project-site.firebaseapp.com",
      databaseURL: "https://web-development-project-site-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "web-development-project-site",
      storageBucket: "web-development-project-site.appspot.com",
      messagingSenderId: "465762016992",
      appId: "1:465762016992:web:580d0c1908d0d3cb2d7a85",
      measurementId: "G-X145YQC3YK"
    };
 
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
 
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = this.username.value;
        const password = this.password.value;
 
        // Sign in the user with Firebase Authentication
        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                // User signed in successfully
                const user = userCredential.user;
                if (user.email === 'vignesh0000g@gmail.com') {
                    // Redirect to admin page
                    window.location.href = "admin.html"; 
                } else {
                    // Redirect to pricing page
                    window.location.href = "pricing.html"; 
                }
            })
            .catch((error) => {
                showToast('Invalid Credentials');
            });
    });
  
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerHTML = message;
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000); 
    }

    document.getElementById('forgotPassword').addEventListener('click', function() {
        const email = prompt("Please enter your email address for password reset:");
        if (email) {
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    showToast('Password reset email sent. Please check your inbox.');
                })
                .catch((error) => {
                    showToast('Invalid Data');
                });
        }
    });

    // Display the current year in the footer
    document.getElementById("currentYear").innerText = new Date().getFullYear();
   </script>
</body>
</html>
