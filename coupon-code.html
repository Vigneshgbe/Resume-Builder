<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="https://img.icons8.com/?size=100&id=a4l6bA9mSmBh&format=png&color=40C057" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;

        .footer {
            background-color: #343a40;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
            position: static;
            width: 100%;
            margin-top: auto;
        }

        .footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        .btn-primary {
            width: 100%;
            background-color: #007bff;
            border-color: #007bff;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .container {
            max-width: 600px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Resume Builder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><strong>HOME</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="free.html"><strong>FREE</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="coupon-code.html"><strong>PAID</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><strong>ABOUT US</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html"><strong>CONTACT US</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html"><strong>PRICING</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="terms-and-conditions.html"><strong>TERMS</strong></a></li>
                    <li class="nav-item"><a class="nav-link" href="privacy-policy.html"><strong>PRIVACY</strong></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>Enter Your Coupon Code</h1>
        <br>
        <p>Please enter the coupon code you received by mail or WhatsApp after your payment to unlock additional features:</p>
        <form id="couponForm">
            <div class="mb-3">
                <label for="couponCode" class="form-label">Coupon Code</label>
                <input type="text" class="form-control" id="couponCode" placeholder="Enter your coupon code here" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Coupon</button>
        </form>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="footer">
        <p>Developed by iGreatApps <span id="currentYear"></span>. All rights reserved.</p>
    </footer>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyByIQWS4VhN_GMhGPy-o8Mp3HHZLXKAU_k",
            authDomain: "web-development-project-site.firebaseapp.com",
            databaseURL: "https://web-development-project-site-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "web-development-project-site",
            storageBucket: "web-development-project-site.appspot.com",
            messagingSenderId: "465762016992",
            appId: "1:465762016992:web:a5418990778571632d7a85",
            measurementId: "G-6G4FJTQZCZ"
        };
    
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); 
    
        document.addEventListener('DOMContentLoaded', function() {
            // Footer Year Auto Update
            const footerYear = document.getElementById('currentYear');
            const currentYear = new Date().getFullYear();
            footerYear.innerHTML = currentYear;
    
            // Toast creation function
            function showToast(message, isSuccess) {
                const toastContainer = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.classList.add('toast', 'align-items-center', 'text-white', isSuccess ? 'bg-success' : 'bg-danger', 'border-0');
                toast.setAttribute('role', 'alert');
                toast.setAttribute('aria-live', 'assertive');
                toast.setAttribute('aria-atomic', 'true');
    
                toast.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                `;
    
                toastContainer.appendChild(toast);
                const bsToast = new bootstrap.Toast(toast);
                bsToast.show();
    
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }
    
            // JavaScript function to handle coupon validation
            const couponForm = document.getElementById('couponForm');
    
            couponForm.addEventListener('submit', async function(event) {
                event.preventDefault(); // Prevent form submission
    
                const couponCode = document.getElementById('couponCode').value.trim();
    
                if (couponCode === "") {
                    showToast("Please enter a coupon code.", false);
                    return;
                }
    
                try {
                    const couponRef = collection(db, "resume-coupons");
                    const q = query(couponRef, where("couponcode", "==", couponCode));
                    const snapshot = await getDocs(q);
    
                    if (snapshot.empty) {
                        showToast("Invalid coupon code. Please try again.", false);
                        setTimeout(() => {
                            window.location.href = 'pricing.html';
                        }, 2000);
                    } else {
                        const couponData = snapshot.docs[0].data();
                        
                        // Check if both plan: Pro and discount: 399 are present
                        if (couponData.plan === "Pro" && couponData.discount === 399) {
                            showToast("Coupon applied successfully!", true);
                            setTimeout(() => {
                                window.location.href = 'build2.html';
                            }, 2000);
                        } else {
                            showToast("Coupon code Expired! Try again.", false);
                            setTimeout(() => {
                                window.location.href = 'payment.html';
                            }, 2000);
                        }
                    }
                } catch (error) {
                    console.error("Error validating coupon: ", error);
                    showToast("Error validating coupon code: " + error.message, false);
                }
            });
        });
        </script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.min.js"></script>
</body>
</html>
