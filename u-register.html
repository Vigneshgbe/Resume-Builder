  <div class="login-container">
      <h2>Register</h2>
      <form id="registerForm">
          <input type="text" id="username" placeholder="Username" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="password" id="password" placeholder="Password" required minlength="6">
          <input type="url" id="profileImage" placeholder="Profile Image URL (Optional)">
          <button type="submit" id="registerButton">Register</button>
          <div id="loadingSpinner" style="display: none;">Loading...</div>
      </form>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

  <script type="module">
   // Import the functions you need from the SDKs
   import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
   import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
   import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

   // Your web app's Firebase configuration
   const firebaseConfig = {
       apiKey: "AIzaSyByIQWS4VhN_GMhGPy-o8Mp3HHZLXKAU_k",
       authDomain: "web-development-project-site.firebaseapp.com",
       projectId: "web-development-project-site",
       storageBucket: "web-development-project-site.appspot.com",
       messagingSenderId: "465762016992",
       appId: "1:465762016992:web:580d0c1908d0d3cb2d7a85",
       measurementId: "G-X145YQC3YK"
   };

   // Initialize Firebase
   const app = initializeApp(firebaseConfig);
   const auth = getAuth(app);
   const db = getFirestore(app);

    // Function to get current date and time
    function getCurrentDateTime() {
       const now = new Date();
       const date = now.toLocaleDateString();
       const time = now.toLocaleTimeString();
       const day = now.toLocaleDateString('en-us', { weekday: 'long' });
       return { date, time, day };
   }

   // Registration
   document.getElementById('registerForm').addEventListener('submit', function(event) {
       event.preventDefault();
       const username = document.getElementById('username').value;
       const email = document.getElementById('email').value;
       const password = document.getElementById('password').value;
       const profileImage = document.getElementById('profileImage').value || '';

        // Get current date, time, and day
        const { date, time, day } = getCurrentDateTime();

        document.getElementById('registerButton').disabled = true;
       document.getElementById('loadingSpinner').style.display = 'block';

       createUserWithEmailAndPassword(auth, email, password)
           .then((userCredential) => {
               const user = userCredential.user;

               // Store additional user information in Firestore
               return addDoc(collection(db, 'resume-users'), {
                uid: user.uid,
                   username: username,
                   email: email,
                   profileImage: profileImage,
                   registrationDate: date,
                   registrationTime: time,
                   registrationDay: day,
               });
           })
           .then(() => {
               // Show success toast
               const toast = document.getElementById('toast');
               toast.classList.add('show');
               setTimeout(() => {
                   toast.classList.remove('show');
               }, 3000);

               document.getElementById('registerButton').disabled = false;
               document.getElementById('loadingSpinner').style.display = 'none';
               document.getElementById('registerForm').reset();
           })
           .catch((error) => {
               alert(error.message);
               document.getElementById('registerButton').disabled = false;
               document.getElementById('loadingSpinner').style.display = 'none';
           });
   });

  function registerUser(username, email, password) {
  const userId = database.ref().child('resume-users').push().key; 
  const userData = {
    username: username,
    email: email,
    password: password
  };
  const updates = {};
  updates['/resume-users/' + userId] = userData;
  database.ref().update(updates)
    .then(() => {
      console.log('User registered successfully!');
    })
    .catch((error) => {
      console.error('Error registering user');
    });
}
function loginUser(email, password) {
  database.ref('/resume-users').orderByChild('email').equalTo(email).once('value')
    .then((snapshot) => {
      if (snapshot.exists()) {
        const userData = snapshot.val();
        const userId = Object.keys(userData)[0];
        if (userData[userId].password === password) {
          console.log('Login successful!');
        } else {
          console.error('Incorrect password!');
        }
      } else {
        console.error('User does not exist!');
      }
    })
    .catch((error) => {
      console.error('Error logging in');
    });
}
   function showToast(message) {
       const toast = document.getElementById('toast');
       toast.textContent = message;
       toast.className = 'toast show';
       setTimeout(() => toast.className = 'toast', 3000);
   }
</script>
