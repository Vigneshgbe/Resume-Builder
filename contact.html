<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Resume Builder</title>
<link rel="icon" href="https://img.icons8.com/?size=100&id=a4l6bA9mSmBh&format=png&color=2D5F4C" type="image/x-icon">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">Resume<span>Builder</span></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="templates.html">Templates</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="block">
    <div class="container-narrow">
      <h1>Get in touch</h1>
      <p class="muted">Found a bug, or have a suggestion? Send a note below.</p>

      <form id="contactForm" style="margin-top:28px;">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
      <p id="contactNote" class="hint" style="margin-top:12px; display:none;"></p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="brand" style="color:#F7F5F1; margin-bottom:8px; display:block;">Resume<span>Builder</span></div>
      <p style="color:#8B8579; margin:0; max-width:32ch; font-size:0.9rem;">A fast, free way to put together a clean resume.</p>
    </div>
    <ul class="footer-links">
      <li><a href="templates.html">Templates</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="terms-and-conditions.html">Terms</a></li>
      <li><a href="privacy-policy.html">Privacy</a></li>
    </ul>
  </div>
  <div class="container footer-bottom">
    Developed by iGreatApps <span id="currentYear"></span>. All rights reserved.
  </div>
</footer>

<script src="assets/site.js"></script>
<script>
  // Opens the visitor's mail client with the message pre-filled.
  // No backend, no accounts, no analytics — this is intentionally basic.
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value;
    var email = document.getElementById('email').value;
    var message = document.getElementById('message').value;
    var body = 'Name: ' + name + '\nEmail: ' + email + '\n\n' + message;
    var mailto = 'mailto:igreatapps@gmail.com?subject=' + encodeURIComponent('Resume Builder contact form') + '&body=' + encodeURIComponent(body);
    window.location.href = mailto;

    var note = document.getElementById('contactNote');
    note.style.display = 'block';
    note.textContent = 'Opening your email app now. If nothing happens, email igreatapps@gmail.com directly.';
  });
</script>
</body>
</html>
